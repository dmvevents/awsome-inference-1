version: 0.2

# ==============================================================================
# CodeBuild spec — networking-base:v5 (+ efa-rdma-base:v1 foundation)
# ==============================================================================
#
# Builds the GPU + RDMA networking foundation and pushes to a private ECR.
# Only needs to re-run when base/** changes upstream in the awesome-inferencing
# monorepo (see CODEBUILD-SETUP.md for triggering strategy).
#
# Prerequisites (set in the CodeBuild project ENV):
#   AWS_ACCOUNT_ID     e.g. 058264135704
#   AWS_DEFAULT_REGION e.g. us-east-2
#   ECR_REPO_PREFIX    e.g. "" (for repos at root) or "dynamo-inference/"
#   BASE_SOURCE_REPO   e.g. https://github.com/aws-samples/awesome-inferencing.git
#   BASE_SOURCE_BRANCH e.g. main
#
# CodeBuild project settings required (see docs/CODEBUILD-SETUP.md):
#   ComputeType:      BUILD_GENERAL1_LARGE (8 vCPU / 15 GB / 200 GB SSD)
#   PrivilegedMode:   true            # Docker-in-Docker
#   ServiceRole:      ecr:* to two repos + logs + S3 SBOM bucket
#
# Output:
#   $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/${ECR_REPO_PREFIX}efa-rdma-base:v1
#   $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/${ECR_REPO_PREFIX}networking-base:v5
#
# Build time: ~30 min cold, ~5 min with BuildKit inline cache.

env:
  variables:
    ECR_REPO_PREFIX: ""
    BASE_SOURCE_REPO: "https://github.com/aws-samples/awesome-inferencing.git"
    BASE_SOURCE_BRANCH: "main"
  exported-variables:
    - NETWORKING_BASE_URI

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - docker --version
      - aws --version

  pre_build:
    commands:
      - |
        set -euo pipefail
        export ECR="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        export EFA_BASE_URI="${ECR}/${ECR_REPO_PREFIX}efa-rdma-base:v1"
        export NETWORKING_BASE_URI="${ECR}/${ECR_REPO_PREFIX}networking-base:v5"
        echo "ECR registry:        ${ECR}"
        echo "Target efa-rdma-base: ${EFA_BASE_URI}"
        echo "Target networking-base: ${NETWORKING_BASE_URI}"

      - echo "[pre_build] Logging in to ECR..."
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}"
          | docker login --username AWS --password-stdin "${ECR}"

      - echo "[pre_build] Ensuring ECR repos exist..."
      - |
        for repo in "${ECR_REPO_PREFIX}efa-rdma-base" "${ECR_REPO_PREFIX}networking-base"; do
          aws ecr describe-repositories --repository-names "$repo" \
              --region "${AWS_DEFAULT_REGION}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$repo" \
                 --region "${AWS_DEFAULT_REGION}" \
                 --image-scanning-configuration scanOnPush=true \
                 --encryption-configuration encryptionType=AES256
        done

      - echo "[pre_build] Cloning base Dockerfiles from awesome-inferencing..."
      - git clone --depth=1 --branch "${BASE_SOURCE_BRANCH}" "${BASE_SOURCE_REPO}" /tmp/ai
      - test -f /tmp/ai/base/efa-rdma-base/Dockerfile
      - test -f /tmp/ai/base/networking-base/Dockerfile

      - echo "[pre_build] Pulling previous versions (for BuildKit inline cache)..."
      - docker pull "${EFA_BASE_URI}" 2>/dev/null || echo "  (no cached efa-rdma-base — first build)"
      - docker pull "${NETWORKING_BASE_URI}" 2>/dev/null || echo "  (no cached networking-base — first build)"

  build:
    commands:
      - echo "[build] Building efa-rdma-base:v1 (~5 min)..."
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "${EFA_BASE_URI}" \
          -t efa-rdma-base:v1 \
          -t "${EFA_BASE_URI}" \
          /tmp/ai/base/efa-rdma-base/

      - echo "[build] Building networking-base:v5 (~25 min cold)..."
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg EFA_RDMA_BASE=efa-rdma-base:v1 \
          --cache-from "${EFA_BASE_URI}" \
          --cache-from "${NETWORKING_BASE_URI}" \
          -t networking-base:v5 \
          -t "${NETWORKING_BASE_URI}" \
          /tmp/ai/base/networking-base/

  post_build:
    commands:
      - echo "[post_build] Pushing base images to ECR..."
      - docker push "${EFA_BASE_URI}"
      - docker push "${NETWORKING_BASE_URI}"

      - echo "[post_build] External trivy CVE scan on networking-base:v5..."
      - |
        mkdir -p cve-reports
        trivy image --severity CRITICAL,HIGH --scanners vuln \
          --format table --timeout 30m --no-progress --skip-version-check \
          --output cve-reports/networking-base_v5_cve-critical-high.txt \
          networking-base:v5 || echo "  trivy scan completed (non-zero allowed)"
        # Fail the build if any CRITICAL appears and no allowlist is in effect
        if [ -z "${CVE_ALLOW_CRITICAL:-}" ] && grep -qE '│ CRITICAL │' cve-reports/networking-base_v5_cve-critical-high.txt; then
          echo "✗ CRITICAL CVE(s) detected in networking-base:v5 and CVE_ALLOW_CRITICAL is not set"
          grep -E '│ CRITICAL │' cve-reports/networking-base_v5_cve-critical-high.txt | head -20
          exit 1
        fi
        echo "✓ networking-base:v5 CVE gate passed (or allowlisted)"

      - echo "[post_build] Emitting image URI for downstream CodePipeline stages..."
      - echo "NETWORKING_BASE_URI=${NETWORKING_BASE_URI}" | tee build.env
      - echo "EFA_BASE_URI=${EFA_BASE_URI}"               | tee -a build.env

artifacts:
  files:
    - build.env
    - cve-reports/**/*
  name: base-build-$(date +%Y-%m-%d-%H%M%S)

cache:
  paths:
    - '/root/.docker/**/*'
